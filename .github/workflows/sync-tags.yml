name: Sync Tags from Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Push Upstream Tags
        run: |
          git remote add upstream https://github.com/realbestia1/erdb.git
          git fetch --force --tags upstream
          git push --force --tags https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
